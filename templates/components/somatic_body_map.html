<!-- Feature 2: Somatic Tension Map & Interactive Body Relief Guide -->
<div x-data="somaticBodyMap()" 
     class="bg-[#222F2A]/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 border border-[#344A40] shadow-md space-y-6">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-[#344A40]">
        <div>
            <div class="flex items-center space-x-2">
                <span class="px-3 py-1 rounded-full bg-[#2D6B52]/20 text-[#6BAF8A] border border-[#2D6B52]/40 text-[11px] font-semibold uppercase tracking-wider">
                    🌸 Somatic Body Scan
                </span>
            </div>
            <h3 class="font-heading font-bold text-2xl text-[#E8EEF0] mt-1">Interactive Somatic Tension Map</h3>
            <p class="text-xs text-[#8A9EA8] mt-0.5">Where is your body holding tension right now? Tap a region to release it.</p>
        </div>
    </div>

    <!-- Body Map Grid Layout -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
        
        <!-- Left: Interactive Body Region Selector Buttons (6 Cols) -->
        <div class="md:col-span-6 space-y-2.5">
            <template x-for="zone in bodyZones" :key="zone.id">
                <button type="button" 
                        @click="selectZone(zone)"
                        class="w-full p-4 rounded-2xl border text-left flex items-center justify-between transition-all duration-300 transform hover:-translate-y-0.5"
                        :class="selectedZone && selectedZone.id === zone.id ? 'border-[#6BAF8A] bg-[#2D6B52]/30 ring-2 ring-[#6BAF8A]/40 text-[#E8EEF0]' : 'border-[#344A40] bg-[#1A2420] text-[#D5DED8] hover:border-[#6BAF8A]/50'">
                    <div class="flex items-center space-x-3">
                        <span class="text-xl" x-text="zone.icon"></span>
                        <div>
                            <span class="font-heading font-bold text-sm text-[#E8EEF0] block" x-text="zone.name"></span>
                            <span class="text-[11px] text-[#8A9EA8] block" x-text="zone.sensation"></span>
                        </div>
                    </div>
                    <span class="text-xs text-[#D4A55A] font-bold" x-text="selectedZone && selectedZone.id === zone.id ? 'Selected ✓' : 'Tap to scan'"></span>
                </button>
            </template>
        </div>

        <!-- Right: Unfolded Micro-Relief Exercise Card (6 Cols) -->
        <div class="md:col-span-6">
            <div class="bg-[#1A2420] text-[#E8EEF0] rounded-3xl p-6 sm:p-8 border border-[#344A40] shadow-xl space-y-5 relative overflow-hidden min-h-[340px] flex flex-col justify-between">
                
                <div class="space-y-4 relative z-10">
                    <div class="flex justify-between items-center border-b border-[#344A40] pb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-2xl" x-text="selectedZone ? selectedZone.icon : '🌸'"></span>
                            <h4 class="font-heading font-bold text-lg text-[#E8EEF0]" x-text="selectedZone ? selectedZone.name + ' Relief' : 'Select a Body Zone'"></h4>
                        </div>
                        <span class="px-2.5 py-1 rounded-full bg-[#2D6B52]/30 text-[#6BAF8A] text-[10px] font-bold uppercase tracking-wider border border-[#2D6B52]/40">
                            30-Second Somatic Reset
                        </span>
                    </div>

                    <template x-if="selectedZone">
                        <div class="space-y-4">
                            <p class="text-xs text-[#D4A55A] font-bold uppercase tracking-wider" x-text="selectedZone.exerciseTitle"></p>
                            
                            <div class="p-5 rounded-2xl bg-[#222F2A] border border-[#344A40] text-xs sm:text-sm text-[#D5DED8] leading-relaxed font-sans">
                                "<span x-text="selectedZone.exerciseSteps"></span>"
                            </div>
                        </div>
                    </template>
                </div>

                <div class="relative z-10 pt-3 border-t border-[#344A40] flex justify-between items-center text-[11px] text-[#6BAF8A]">
                    <span>Somatic mind-body alignment</span>
                    <button type="button" @click="$dispatch('open-grounding')" class="font-bold text-[#D4A55A] hover:underline">
                        Open 4-7-8 Breathing 🌿 →
                    </button>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
    function somaticBodyMap() {
        return {
            selectedZone: null,

            bodyZones: [
                {
                    id: 'head',
                    icon: '🧠',
                    name: 'Head & Mind',
                    sensation: 'Racing thoughts, forehead tightness',
                    exerciseTitle: 'Forehead Smoothing & Mental Pause',
                    exerciseSteps: 'Close your eyes for 10 seconds. Softly unclench your eyebrows and imagine cool, soothing water smoothing across your forehead. Take one long exhale through your mouth.'
                },
                {
                    id: 'jaw',
                    icon: '🗣️',
                    name: 'Jaw & Neck',
                    sensation: 'Unconscious teeth clenching, neck stiffness',
                    exerciseTitle: 'The Jaw Release Micro-Pause',
                    exerciseSteps: 'Part your lips slightly. Let your tongue rest softly on the floor of your mouth away from your teeth. Gently roll your neck in a slow circle twice.'
                },
                {
                    id: 'shoulders',
                    icon: '🛋️',
                    name: 'Shoulders',
                    sensation: 'Carrying heavy emotional weight & tension',
                    exerciseTitle: 'The 10-Second Shoulder Drop',
                    exerciseSteps: 'Inhale deeply and shrug your shoulders up to your ears. Hold for 3 seconds... Now drop them completely! Feel the 2-inch relief as tension falls away.'
                },
                {
                    id: 'chest',
                    icon: '🫁',
                    name: 'Chest & Heart',
                    sensation: 'Shallow breathing, chest tightness',
                    exerciseTitle: 'Chest Expansion & Heart Opening Breath',
                    exerciseSteps: 'Place your right hand gently over your heart. Breathe into your hand for 4 seconds, holding unconditional warmth there, then release slowly.'
                },
                {
                    id: 'hands',
                    icon: '👐',
                    name: 'Hands & Stomach',
                    sensation: 'Gripping fists, stomach knotting',
                    exerciseTitle: 'Unclenching Fists & Belly Softening',
                    exerciseSteps: 'Open both hands wide and stretch your fingers out. Soften your stomach completely—let it expand without holding it in. Breathe deep down into your belly.'
                },
                {
                    id: 'feet',
                    icon: '🦵',
                    name: 'Feet & Grounding',
                    sensation: 'Restless, un-grounded energy',
                    exerciseTitle: 'Earth Grounding Sole Press',
                    exerciseSteps: 'Press both soles of your feet firmly into the floor. Feel the solid earth supporting your weight beneath you. You are held and grounded in this moment.'
                }
            ],

            init() {
                this.selectedZone = this.bodyZones[2];
            },

            selectZone(zone) {
                this.selectedZone = zone;
            }
        }
    }
</script>
